<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aircrew Time Tool</title>
<meta name="description" content="Convert Julian day + Zulu takeoff times into local event timelines for flight crews.">
<meta name="theme-color" content="#0b0e13">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='12'%20fill='%230b0e13'/%3E%3Ctext%20x='32'%20y='46'%20font-size='38'%20font-family='monospace'%20font-weight='bold'%20text-anchor='middle'%20fill='%23f5b83d'%3EZ%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>Aircrew Time Tool</h1>
  <p class="subtitle">Julian day + Zulu in &rarr; local event times out</p>
</header>
<main>
  <section class="card">
    <h2>Takeoff</h2>
    <div class="inputs-row">
      <label>Julian day
        <input id="doy" inputmode="numeric" placeholder="254" maxlength="3" autocomplete="off">
      </label>
      <label>Zulu time
        <input id="ztime" inputmode="numeric" placeholder="0530" maxlength="5" autocomplete="off">
      </label>
    </div>
  </section>

  <section class="card">
    <h2>Local time zone</h2>
    <div class="zone-row">
      <input id="zone-input" list="zone-list" autocomplete="off" spellcheck="false">
      <button id="zone-device-btn" type="button" class="ghost">Device zone</button>
      <datalist id="zone-list"></datalist>
    </div>
    <p class="hint">Local times convert to this zone &mdash; defaults to your device&rsquo;s zone.</p>
  </section>

  <section class="card results">
    <h2>Timeline</h2>
    <p id="resolved" class="resolved empty">Enter Julian day and Zulu time&hellip;</p>
    <div class="table-wrap">
      <table id="timeline-table" hidden>
        <thead id="timeline-head"></thead>
        <tbody id="timeline-body"></tbody>
      </table>
    </div>
    <div class="actions">
      <button id="copy-btn" class="primary" type="button" disabled>Copy times</button>
      <button id="share-btn" type="button" disabled>Share&hellip;</button>
    </div>
  </section>
</main>
<footer>
  <span id="version"></span> &middot;
  <a href="https://github.com/JesseHaycraft/aircrew-time-tool/issues" target="_blank" rel="noopener">Report an issue</a> &middot;
  <span>All times are computed on your device</span>
</footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
